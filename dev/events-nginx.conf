server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $ust_backend http://backend:2288;
    access_log off;
    location = /health { default_type text/plain; return 200 "ok\n"; }
    location ~ ^/automation/hooks/(sonarr|radarr|bazarr)$ {
        limit_except POST { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Automation-Key $http_x_automation_key;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_pass $ust_backend;
    }
    location / { return 404; }
}
