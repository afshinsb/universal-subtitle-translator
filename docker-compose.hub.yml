services:
  backend:
    image: ${DOCKERHUB_NAMESPACE:-your-dockerhub-username}/universal-subtitle-translator-backend:${IMAGE_TAG:-1.3.0}
    container_name: subtitle-translator-backend
    env_file:
      - path: .env
        required: false
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: ${APP_PORT:-2288}
      APP_VERSION: ${APP_VERSION:-1.3.0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      SESSION_SECRET: ${SESSION_SECRET:-default-insecure-session-secret-change-before-release}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10240}
      MEDIA_ROOT: ${MEDIA_ROOT:-}
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/data/uploads
      OUTPUT_DIR: /app/data/outputs
      TEMP_DIR: /app/data/temp
      DATABASE_PATH: /app/data/app.db
    volumes:
      - ./data:/app/data
      # Optional for large media libraries:
      # - /srv/media:/media:ro
    expose:
      - "${APP_PORT:-2288}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(f\"http://127.0.0.1:{os.getenv('APP_PORT', '2288')}/health\").read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_NAMESPACE:-your-dockerhub-username}/universal-subtitle-translator-frontend:${IMAGE_TAG:-1.3.0}
    container_name: subtitle-translator-frontend
    environment:
      BACKEND_PORT: ${APP_PORT:-2288}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-10G}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-2288}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
