server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Resolve a replacement backend after updates/restarts on the Docker network.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:${BACKEND_PORT};

    # Import tokens are accepted only through the unpublished internal gateway.
    location ^~ /automation/hooks/ { return 404; }

    location / {
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass $backend_upstream;
    }
}
